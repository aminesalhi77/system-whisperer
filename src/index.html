<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System Whisperer</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="main.js" defer></script>
  </head>
  <body>
    <!-- ONBOARDING -->
    <section id="onboarding" class="screen hidden">
      <div class="onboarding-card">
        <div class="logo-ring"></div>
        <h1>System Whisperer</h1>
        <p class="subtitle">Your computer, explained in plain English.</p>
        <input id="name-input" type="text" placeholder="What should I call you?" autocomplete="off" />
        <button id="start-btn">Start</button>
      </div>
    </section>

    <!-- DASHBOARD -->
    <main id="dashboard" class="screen hidden">
      <div class="dashboard-wrap">
        <header class="header">
          <div>
            <p class="greeting" id="greeting">Hello</p>
            <h1 class="app-title">System Whisperer</h1>
          </div>
          <span class="status-dot" title="Live"></span>
        </header>

        <div class="whisper-card">
          <p id="whisper">Reading your system…</p>
        </div>

        <div class="stats">
          <div class="card" id="cpu-card" data-view="cpu">
            <div class="card-head">
              <span class="label">CPU</span>
              <span id="cpu" class="value">—</span>
            </div>
            <div class="bar"><div id="cpu-bar" class="bar-fill"></div></div>
            <p class="card-hint" id="cpu-hint">Live usage</p>
          </div>

          <div class="card" id="ram-card" data-view="ram">
            <div class="card-head">
              <span class="label">RAM</span>
              <span id="ram" class="value">—</span>
            </div>
            <div class="bar"><div id="ram-bar" class="bar-fill"></div></div>
            <p class="card-hint" id="ram-hint">Live usage</p>
          </div>

          <div class="card" id="disk-card" data-view="disk">
            <div class="card-head">
              <span class="label">Disk (root)</span>
              <span id="disk" class="value">—</span>
            </div>
            <div class="bar"><div id="disk-bar" class="bar-fill"></div></div>
            <p class="card-hint" id="disk-hint">Live usage</p>
          </div>
        </div>
      </div>
    </main>

    <!-- MODAL -->
    <div id="modal" class="modal hidden">
      <div class="modal-card">
        <header class="modal-head">
          <div>
            <p class="modal-kicker" id="modal-kicker">Processes</p>
            <h2 class="modal-title" id="modal-title">Top consumers</h2>
          </div>
          <button id="modal-close" class="modal-close">✕</button>
        </header>

        <!-- Sort tabs (only for CPU/RAM) -->
        <div class="tabs" id="modal-tabs">
          <button class="tab active" data-sort="ram">By memory</button>
          <button class="tab" data-sort="cpu">By CPU</button>
        </div>

        <ul id="process-list" class="process-list">
          <li class="proc-loading">Loading…</li>
        </ul>
      </div>
    </div>
  </body>
</html>
